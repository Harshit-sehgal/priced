name: Hosted beta health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check hosted beta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: https://priced.pricedapp.workers.dev
    steps:
      - name: Check liveness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            "$STAGING_URL/api/health" > /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Check Supabase readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            "$STAGING_URL/api/health?check=db" > /tmp/health-db.json
          grep -q '"ok":true' /tmp/health-db.json
          grep -q '"datastore":"supabase"' /tmp/health-db.json
          grep -q '"db":"ok"' /tmp/health-db.json

      - name: Check Redis readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            "$STAGING_URL/api/health?check=redis" > /tmp/health-redis.json
          grep -q '"ok":true' /tmp/health-redis.json
          grep -q '"redis":"ok"' /tmp/health-redis.json

      # Every prerendered HTML page returned 500 for an unknown period because
      # the session-refresh proxy makes them dynamic at request time under
      # OpenNext, and nothing checked an HTML page other than `/`. Liveness and
      # readiness were green the whole time. These routes are cheap, public, and
      # the exact shape of the previous outage.
      - name: Check public HTML routes render
        run: |
          set -euo pipefail
          for path in /login /welcome /checkout/mock /about /terms /privacy /refunds; do
            status=$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
              -o /dev/null -w '%{http_code}' "$STAGING_URL$path")
            if [ "$status" != "200" ]; then
              echo "::error::$path returned $status"
              exit 1
            fi
            echo "  ✓ $path 200"
          done

      # Config drift: NEXT_PUBLIC_APP_URL builds the Dodo return URLs, the
      # validateCta self-host blocklist, and every canonical URL. A stale value
      # sends paid customers to a dead host and silently weakens the CTA rule.
      # This deployment has already moved Vercel -> Cloudflare once, so the
      # failure mode is real; nothing detected it before.
      - name: Check serving origin matches NEXT_PUBLIC_APP_URL
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            "$STAGING_URL/api/health?check=origin" > /tmp/health-origin.json
          grep -q '"origin":"ok"' /tmp/health-origin.json


      # The signed webhook endpoint is the ONLY path that can finalize a
      # takeover, and it is excluded from the session proxy — so a routing or
      # deploy regression could take it offline while every other probe stays
      # green. An UNSIGNED POST is rejected with 400 before any DB write, so
      # this probe creates no payment_event and moves no money. 503 is also
      # acceptable (endpoint live, payment datastore unconfigured).
      - name: Check the payment webhook endpoint is reachable
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            -o /dev/null -w '%{http_code}' -X POST "$STAGING_URL/api/webhooks/payments" \
            -H 'content-type: application/json' \
            -d '{"id":"evt_health_probe","type":"payment.failed"}')
          if [ "$status" != "400" ] && [ "$status" != "503" ]; then
            echo "::error::/api/webhooks/payments unsigned POST returned $status (expected 400 or 503)"
            exit 1
          fi
          echo "  ✓ /api/webhooks/payments reachable (unsigned rejected: $status)"

