name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bounded: a hung `next start` or Docker pull must not burn the 360-minute
    # default budget.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo has no step that needs the token after checkout.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Market rules tests
        run: npm run test:market

      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Build must not require real credentials; app falls back to demo mode.
          NEXT_TELEMETRY_DISABLED: 1

      # CI built the plain Next app but never the artifact that actually ships.
      # Production runs on Cloudflare Workers via OpenNext, and that adaptation
      # can fail on things `next build` is perfectly happy with: a Node API
      # workerd does not implement, a middleware incompatibility, a bundling
      # error. Without this, such a break passes CI green and is discovered at
      # deploy time. Note OpenNext itself warns that Node.js middleware support
      # on Cloudflare is experimental, and this app HAS middleware.
      - name: Build the Cloudflare Worker (the real deploy artifact)
        run: |
          set -euo pipefail
          # The deploy config must be tracked: `npm run cf:deploy` is documented
          # but silently cannot run without it, and CI's build step would pass
          # while the deploy path is broken.
          test -f open-next.config.ts
          test -f wrangler.jsonc
          # This is a COMPILE GATE, not a deployable artifact: NEXT_PUBLIC_*
          # must be exported at cf:build time to be inlined into the client
          # bundle, and CI deliberately has no secrets. Deploys build locally
          # with the public vars exported (DEPLOY.md §3).
          npm run cf:build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Browser tests (§54)
        run: npm run test:browser
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Real money-path verification against REAL Postgres row locks, not the
      # in-memory adapter. Boots throwaway postgres:16-alpine containers and
      # applies every migration in filename order, so this also proves the
      # "fresh DB boots from supabase/migrations/" claim by construction.
      # Covers: concurrency races, IDEMPOTENCY_CONFLICT, the finalize_takeover
      # idempotency re-check under lock, and SQL<->TypeScript pricing parity.
      - name: Real-Postgres money path + pricing parity
        run: npm run test:pg

      # The two SQL sources must genuinely agree. This previously checked only
      # that files existed and grepped for two strings, which cannot see drift
      # inside a function BODY — and real drift had accumulated behind it:
      # analytics_events was never mirrored into db/, so the operator bootstrap
      # documented in DEPLOY.md could not apply to a fresh database at all.
      # This boots two databases, applies one source to each, and diffs
      # columns, constraints, indexes and every function definition.
      - name: Schema equivalence — db/*.sql matches supabase/migrations/
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -f supabase/migrations/README.md
          npm run test:schema

      - name: Analytics + health smoke (no DB — verifies HTTP contract and taxonomy)
        run: |
          set -euo pipefail
          npx next start -p 3112 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3112/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3112/api/health | grep -q '"ok":true'
          curl -sf "http://127.0.0.1:3112/api/health?check=db" | grep -q '"ok"'
          # POST /api/analytics taxonomy + validation (demo mode: best-effort insert, never 500)
          curl -sf -X POST http://127.0.0.1:3112/api/analytics \
            -H 'content-type: application/json' \
            -d '{"event":"domain_opened","props":{"domain":"example.com"}}' | grep -q '"ok":true'
          # Unknown taxonomy must be rejected with EXACTLY 422. The previous
          # `curl -sf` only proved "non-2xx", so a 500 also passed.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3112/api/analytics \
            -H 'content-type: application/json' \
            -d '{"event":"not_a_real_event"}')
          if [ "$status" != "422" ]; then
            echo "expected 422 for unknown event, got $status"; exit 1;
          fi
          echo "analytics + health smoke passed"
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Concurrency race test over live HTTP (§74)
        run: |
          npx next start -p 3111 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3111/api/market/pulse > /dev/null; then break; fi
            sleep 1
          done
          node tests/load/race.mjs http://127.0.0.1:3111 12
          STATUS=$?
          kill $SERVER_PID
          exit $STATUS
        env:
          NEXT_TELEMETRY_DISABLED: 1

  hosted-beta:
    name: Hosted beta smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No secrets are needed. This checks the stable Cloudflare contract and
      # never creates a quote, checkout, sale, or payment.
      - name: Run hosted smoke
        run: npm run smoke:staging
        env:
          STAGING_URL: https://priced.harshit10sehgal.workers.dev
